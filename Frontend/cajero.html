<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de cajero | Banco Mariano</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="cajero.html"><img src="img/logo.svg" alt="">Banco Mariano</a>
    <span class="usuario-actual" id="nombre-usuario"></span>
    <button class="secundario pequeno" id="salir">Salir</button>
  </header>
  <main hidden>
    <h1>Panel de cajero</h1>
    <div class="pestanas">
      <button data-seccion="crear">Crear cuenta</button>
      <button data-seccion="deposito">Depósito</button>
      <button data-seccion="retiro">Retiro</button>
    </div>

    <section class="tarjeta angosta" id="crear" hidden>
      <h2>Crear cuenta monetaria</h2>
      <form id="form-cuenta">
        <label>Nombre de la cuenta<input name="nombre" maxlength="120" required></label>
        <label>No. Cuenta<input name="numero" inputmode="numeric" pattern="\d{6,20}" title="De 6 a 20 dígitos" required></label>
        <label>Identificación (DPI)<input name="dpi" inputmode="numeric" pattern="\d{13}" title="13 dígitos" required></label>
        <label>Monto Inicial<input name="monto" type="number" min="0" step="0.01" required></label>
        <button type="submit">Crear cuenta</button>
      </form>
    </section>

    <section class="tarjeta angosta" id="deposito" hidden>
      <h2>Depósito monetario</h2>
      <form id="form-deposito">
        <label>No. Cuenta<input name="numero" inputmode="numeric" pattern="\d{6,20}" title="De 6 a 20 dígitos" required></label>
        <label>Cantidad a depositar<input name="monto" type="number" min="0.01" step="0.01" required></label>
        <button type="submit">Depositar</button>
      </form>
    </section>

    <section class="tarjeta angosta" id="retiro" hidden>
      <h2>Retiro monetario</h2>
      <form id="form-retiro">
        <label>No. Cuenta<input name="numero" inputmode="numeric" pattern="\d{6,20}" title="De 6 a 20 dígitos" required></label>
        <label>Cantidad a debitar<input name="monto" type="number" min="0.01" step="0.01" required></label>
        <button type="submit">Retirar</button>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/cajero.js"></script>
</body>
</html>
