ServerName banco-mariano
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    # La raiz del sitio entrega el Frontend; /api entrega el Backend.
    DocumentRoot /var/www/frontend
    DirectoryIndex index.html

    <Directory /var/www/frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api /var/www/backend/public
    <Directory /var/www/backend/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /api/index.php
    </Directory>

    # IP real del visitante detras del proxy de Render.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    # El reporte de GoAccess usa scripts en linea; solo el administrador puede abrirlo.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" "expr=%{THE_REQUEST} !~ m#/api/admin/logs#"

    SetEnvIf Request_URI "^/api/health$" no_registrar
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" banco
    CustomLog /var/log/apache2/banco_access.log banco env=!no_registrar
    ErrorLog /proc/self/fd/2
</VirtualHost>
